name: Build App

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      abi:
        description: "ABI to build (empty = all): arm64-v8a,armeabi-v7a,x86,x86_64"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch source code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install CMake
        run: sdkmanager --install "cmake;3.31.6"

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y extra-cmake-modules gettext

      - name: Decode keystore
        id: keystore
        env:
          KEY_B64: ${{ secrets.SIGN_KEY_BASE64 }}
        run: |
          if [ -n "$KEY_B64" ]; then
            echo "$KEY_B64" | base64 -d > keystore.jks
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build app
        run: ./gradlew :app:assembleRelease
        env:
          BUILD_VERSION_NAME: ${{ github.ref_name }}
          BUILD_COMMIT_HASH: ${{ github.sha }}
          BUILD_ABI: ${{ github.event.inputs.abi || '' }}
          SIGN_KEY_FILE: ${{ steps.keystore.outputs.has_keystore == 'true' && 'keystore.jks' || '' }}
          SIGN_KEY_PWD: ${{ secrets.SIGN_KEY_PWD }}
          SIGN_KEY_ALIAS: ${{ secrets.SIGN_KEY_ALIAS }}

      - name: Build plugins
        run: ./gradlew :assembleReleasePlugins
        env:
          BUILD_VERSION_NAME: ${{ github.ref_name }}
          BUILD_COMMIT_HASH: ${{ github.sha }}
          BUILD_ABI: ${{ github.event.inputs.abi || '' }}
          SIGN_KEY_FILE: ${{ steps.keystore.outputs.has_keystore == 'true' && 'keystore.jks' || '' }}
          SIGN_KEY_PWD: ${{ secrets.SIGN_KEY_PWD }}
          SIGN_KEY_ALIAS: ${{ secrets.SIGN_KEY_ALIAS }}

      - name: Upload app APK
        uses: actions/upload-artifact@v6
        with:
          name: fcitx5-android-app
          path: app/build/outputs/apk/release/*.apk

      - name: Pack plugins
        shell: bash
        run: |
          mkdir -p plugins-to-upload
          for dir in plugin/*/; do
            name=$(basename "$dir")
            apk_dir="plugin/${name}/build/outputs/apk/release"
            if [ -d "$apk_dir" ] && ls "$apk_dir"/*.apk 2>/dev/null; then
              mkdir -p "plugins-to-upload/${name}"
              cp "$apk_dir"/*.apk "plugins-to-upload/${name}/"
            fi
          done

      - name: Upload plugins
        uses: actions/upload-artifact@v6
        with:
          name: fcitx5-android-plugins
          path: plugins-to-upload
